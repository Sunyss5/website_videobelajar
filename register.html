<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/main.css">
    <title>Daftar - videobelajar</title>
</head>
<body>
    <!-- Header/Navbar -->
    <header class="navbar-container">
        <div class="navbar-main">
            <a class="box-logo-videobelajar" href="./index.html">
                <img class="logo-videobelajar" src="./assets/Logo.png" alt="logo video belajar">
            </a>
        </div>
    </header>

    <main class="auth-main">
        <section class="auth-card">
            <div class="auth-header">
                <h3 class="heading-3 auth-title">Pendaftaran Akun</h3>
                <p class="body-medium-regular auth-subtitle">Yuk, daftarkan akunmu sekarang juga!</p>
            </div>

            <form class="auth-form" action="#">
                <div class="auth-fields">
                    <div class="form-group">
                        <label class="body-medium-regular form-label" for="fullname">
                            Nama Lengkap <span class="form-required">*</span>
                        </label>
                        <input class="form-input" type="text" id="fullname" name="fullname" required>
                    </div>

                    <div class="form-group">
                        <label class="body-medium-regular form-label" for="email">
                            E-Mail <span class="form-required">*</span>
                        </label>
                        <input class="form-input" type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label class="body-medium-regular form-label" for="phone">
                            No. Hp <span class="form-required">*</span>
                        </label>
                        <div class="form-phone">
                            <div class="form-phone-code">
                                <span class="form-phone-flag" aria-hidden="true"></span>
                                <select class="form-select" name="country-code" aria-label="Kode negara">
                                    <option value="+62">+62</option>
                                    <option value="+60">+60</option>
                                    <option value="+65">+65</option>
                                </select>
                            </div>
                            <input class="form-input" type="tel" id="phone" name="phone" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="body-medium-regular form-label" for="password">
                            Kata Sandi <span class="form-required">*</span>
                        </label>
                        <div class="form-password">
                            <input class="form-input" type="password" id="password" name="password" required>
                            <button type="button" class="form-password-toggle" aria-label="Tampilkan kata sandi">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="body-medium-regular form-label" for="confirm-password">
                            Konfirmasi Kata Sandi <span class="form-required">*</span>
                        </label>
                        <div class="form-password">
                            <input class="form-input" type="password" id="confirm-password" name="confirm-password" required>
                            <button type="button" class="form-password-toggle" aria-label="Tampilkan konfirmasi kata sandi">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                    <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                    <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"></path>
                                    <line x1="1" y1="1" x2="23" y2="23"></line>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <a class="body-medium-regular auth-forgot" href="#">Lupa Password?</a>
                </div>

                <div class="auth-actions">
                    <button type="submit" class="btn button-primary-contained auth-btn">Daftar</button>
                    <a href="./login.html" class="btn button-primary-shadow auth-btn">Masuk</a>
                </div>
            </form>

            <div class="auth-divider">
                <span class="body-medium-regular">atau</span>
            </div>

            <button type="button" class="btn auth-google-btn">
                <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                    <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
                    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
                </svg>
                Daftar dengan Google
            </button>
        </section>
    </main>
</body>
</html>
